name: Test and deploy wine
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: API, collection and deployment tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
            ops/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-ci.txt
      - name: Python checks and tests (no model download)
        env:
          WINE_FRONTEND_DIST: ${{ github.workspace }}/dist
        run: |
          python -m compileall -q backend wine_curation ops
          python -m pytest -q backend/tests/test_guest_access.py backend/tests/test_collection.py backend/tests/test_product.py backend/tests/test_scan_image.py backend/tests/test_runpod_integration.py backend/tests/test_server.py backend/tests/test_exports.py backend/tests/test_annotation_formats.py ops/tests
      - name: Browser script syntax and age notice
        run: |
          find dist backend/static/admin -name '*.js' -print0 | xargs -0 -n1 node --check
          node backend/tests/test_age_gate.cjs
      - name: Verify deployment archive
        run: |
          git archive --format=tar.gz --prefix=wine/ HEAD -o /tmp/wine-release.tar.gz
          python ops/check_package.py /tmp/wine-release.tar.gz
  deploy:
    name: Deploy main to production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Authenticate with GitHub OIDC and deploy this commit
        run: python3 ops/github_deploy.py
      - name: Public readiness check
        run: |
          curl --fail --silent --show-error https://wine.77-105-169-21.sslip.io/api/status | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d); assert d["ready"] is True'
