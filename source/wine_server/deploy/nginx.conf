server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name wine.77-105-169-21.sslip.io;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/wine; }
    location / { return 301 https://wine.77-105-169-21.sslip.io$request_uri; }
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name wine.77-105-169-21.sslip.io;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/wine.77-105-169-21.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wine.77-105-169-21.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WineSSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 25m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
